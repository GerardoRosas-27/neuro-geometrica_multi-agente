[package]
name = "cdt_rqm_epr"
version = "0.1.0"
edition = "2021"
description = "Neuro-geometrica v4: campo Dphi + CDT/teacher (E31-E45) y app agentica"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
# App web agentica (Axum) + telemetría. Activar con --features web.
web = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:tower",
    "dep:futures-util",
    "dep:ureq",
]

[[bin]]
name = "run_field_autonomy_v4"
path = "src/bin/run_field_autonomy_v4.rs"

[[bin]]
name = "agentic_web"
path = "src/bin/agentic_web.rs"
required-features = ["web"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
num-complex = "0.4.6"
rand = "0.8"
rand_xoshiro = "0.6"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

# Feature `web` (opcionales; no afectan `cargo test --lib` por defecto)
axum = { version = "0.8", optional = true, features = ["json"] }
tokio = { version = "1", optional = true, features = ["full"] }
tower-http = { version = "0.6", optional = true, features = ["fs", "cors", "trace", "set-header"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
uuid = { version = "1", optional = true, features = ["v4", "serde"] }
tower = { version = "0.5", optional = true, features = ["util"] }
futures-util = { version = "0.3", optional = true }
# Cliente HTTP bloqueante para proveedores LLM externos (OpenAI-compatible).
ureq = { version = "2.12", optional = true, features = ["json"] }
sha2 = "0.10"
