name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy y gates de regresión
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Los tests de biblioteca incluyen los gates científicos de regresión
      # (cuenca de consolidación multi-semilla, generalización cognitiva,
      # validación adversarial y descubrimiento de familia). Se ejecutan en
      # release: son numéricamente pesados y en debug tardarían órdenes más.
      - name: Tests y gates científicos
        run: cargo test --release --lib
