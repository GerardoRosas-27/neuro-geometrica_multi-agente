name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` fija target-cpu=native. Los wall-clock de este
  # runner (windows-latest) no son comparables entre máquinas; los binarios
  # de CI no se publican como artefactos portables.

jobs:
  smoke:
    name: fmt, clippy y smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Smoke: un ensayo de cuenca y el resto de la librería, sin el gate
      # científico pesado (multisemilla + holdout + ΔR + capacidad) y sin
      # los protocolos cognitivos al 100 % (viven detrás de `research`).
      - name: Tests smoke
        run: cargo test --release --lib -- --skip scientific

  scientific:
    name: gate científico
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      # Multisemilla de cuenca, holdout desmezclado, ΔR como gate, curva
      # de capacidad y escala 128 con K_max ≥ 2.
      - name: Gate científico
        run: cargo test --release --lib scientific -- --nocapture

  # Los protocolos `research` (OS cognitivo, generalización 100 %, VMC/PEPS
  # de test, unificado) NO corren en cada push. Activar a mano:
  #   cargo test --release --lib --features research
