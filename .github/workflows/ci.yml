name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: fmt, clippy y smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy (lib + app web + bins + ejemplos)
        run: cargo clippy --features web --all-targets -- -D warnings

      # Lib + app web (API, auth, jobs train/sueño/pruebas v4, Spider), sin
      # el gate científico ni la prueba con Gemma real (requiere GGUF).
      - name: Tests smoke
        run: cargo test --release --features web --lib -- --skip scientific --skip real_gemma

  scientific:
    name: gate científico v4
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      # Invariantes v4: memoria cero en TEST (0 consultas, 0 LEAKED, CDT
      # borrada), E35 B > A en seeds DEV 0xA400–0xA402 y cota del error a un
      # paso (< 5 %) con la receta §16 (presupuesto reducido).
      - name: Gate científico
        run: cargo test --release --lib scientific -- --nocapture
