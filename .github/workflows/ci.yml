name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` fija target-cpu=native. Los wall-clock de este
  # runner (windows-latest) no son comparables entre máquinas; los binarios
  # de CI no se publican como artefactos portables.

jobs:
  smoke:
    name: fmt, clippy y smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Smoke: un ensayo de cuenca y el resto de la librería, sin el gate
      # científico pesado (multisemilla + holdout endurecido).
      - name: Tests smoke
        run: cargo test --release --lib -- --skip scientific

  scientific:
    name: gate científico
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de compilación
        uses: Swatinem/rust-cache@v2

      # Multisemilla de cuenca y holdout con patrón no inyectado, corrupción
      # > 40 %, ruido de grafo y semilla ausente del fixture de desarrollo.
      - name: Gate científico
        run: cargo test --release --lib scientific -- --nocapture
