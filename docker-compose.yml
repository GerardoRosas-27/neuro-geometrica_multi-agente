# Local: docker compose up --build
# GGUF opcional: monta ./models y exporta GEMMA2_GGUF (mismo patrón que main).
services:
  agentic_web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RUST_LOG: info
      GEMMA2_GGUF: /models/gemma-2-2b-it-Q4_K_M.gguf
    volumes:
      - ./models:/models:ro
