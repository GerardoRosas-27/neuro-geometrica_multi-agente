# Local: docker compose up --build
# La imagen ya trae el GGUF ligero (Q3_K_L). Para otro modelo: monta ./models y
# exporta GEMMA2_GGUF=/models/<archivo>.gguf (o GEMMA2_GGUF_URL para descargarlo).
services:
  agentic_web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RUST_LOG: info
    volumes:
      - ./models:/models:ro
