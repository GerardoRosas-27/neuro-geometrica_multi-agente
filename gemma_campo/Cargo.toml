[package]
name = "gemma_campo"
version = "0.1.0"
edition = "2021"
description = "Sustrato de campo (lento ridge M7 + rápido NLMS) que predice estados ocultos futuros de Gemma 2 2B congelado; entrenamiento GPU wgpu/WGSL sin carreras."
license = "MIT"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
wgpu = "30.0"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
naga = { version = "30.0", features = ["wgsl-in"] }
