[package]
name = "bio_quantum_engine"
version = "0.2.0"
edition = "2021"
description = "Arquitectura Unificada Bio-Cuántica-Geométrica (v10 Singularity GPU Ultra): Aceleración en GPU AMD RDNA3 (RX 7800 XT) con WGPU, Ley de Dale 100% estricta, Espectro Koopman-Brenier, Memoria Topológica CDT y Handshake en C."
license = "MIT"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[lib]
name = "bio_quantum_engine"
path = "src/lib.rs"

[[bin]]
name = "bio_quantum_engine"
path = "src/main.rs"

[dependencies]
wgpu = "30.0"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json"] }
